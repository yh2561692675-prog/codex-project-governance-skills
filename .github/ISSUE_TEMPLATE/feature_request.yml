name: Feature request
description: Propose a bounded governance, installation, or documentation improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please describe evidence and scope. Do not include secrets, private data, or an approval guarantee.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or maintenance burden should be addressed?
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Who will use it, in what workflow, and what is explicitly out of scope?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Give a small interface or documentation example.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and evidence
      description: Define binary acceptance checks, tests, expected exit codes, and evidence location.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility
      description: Explain PowerShell, OS, install, and existing-workflow impact.
    validations:
      required: true
  - type: textarea
    id: risk_rollback
    attributes:
      label: Risk and rollback
      description: Describe failure modes, risk tier, and a recoverable rollback path.
    validations:
      required: true
